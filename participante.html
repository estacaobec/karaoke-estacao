<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Karaokê Estação — Participe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap');
  :root{
    --bg:#14110F; --panel:#1F1A16; --panel-2:#26201B;
    --brass:#C08A3E; --brass-dim:#8A6A38; --signal:#C13B3B;
    --cream:#EDE6D8; --muted:#8A8078; --line: rgba(237,230,216,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'Rajdhani',sans-serif;}
  header.masthead{border-bottom:2px solid var(--brass-dim); padding:16px 18px 12px; background:linear-gradient(180deg,#191512,#14110F);}
  .brand-eyebrow{font-family:'JetBrains Mono',monospace; letter-spacing:.24em; font-size:10px; color:var(--brass); text-transform:uppercase;}
  .brand-title{font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:26px; letter-spacing:.02em; line-height:1; margin-top:4px;}
  .brand-title span{color:var(--brass);}
  main{max-width:560px; margin:0 auto; padding:18px 16px 60px;}
  .panel{background:var(--panel); border:1px solid var(--line); padding:16px; margin-bottom:14px;}
  label.field-label{display:block; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
  input[type=text]{background:var(--panel-2); border:1px solid var(--line); color:var(--cream); padding:12px; font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:600; width:100%;}
  input[type=text]:focus{outline:1px solid var(--brass); border-color:var(--brass);}
  button.btn{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.06em; background:var(--brass); color:#14110F; border:none; padding:13px 18px; cursor:pointer; width:100%;}
  button.btn:disabled{opacity:.35;}
  .row{display:flex; gap:8px;}
  .row input{flex:1;}
  ul.list{list-style:none; margin:10px 0 0; padding:0;}
  ul.list li{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  ul.list li img{border:1px solid var(--line); flex-shrink:0;}
  .song-title{font-weight:600; font-size:15px; flex:1;}
  .mini{background:transparent; border:1px solid var(--brass-dim); color:var(--brass); padding:8px 12px; font-size:12px; font-weight:700; text-transform:uppercase; cursor:pointer; white-space:nowrap;}
  .helptext{color:var(--muted); font-size:12.5px; line-height:1.5; margin-top:8px;}
  .empty-state{padding:20px; text-align:center; color:var(--muted); font-size:13px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--brass); background:var(--panel-2); padding:4px 8px; border:1px solid var(--brass-dim);}
  .toast{position:fixed; left:16px; right:16px; bottom:16px; background:var(--brass); color:#14110F; font-weight:700; padding:14px; text-align:center; display:none;}
</style>
</head>
<body>

<header class="masthead">
  <div class="brand-eyebrow">Bar &amp; Café · Tatuí</div>
  <div class="brand-title">KARAOKÊ <span>ESTAÇÃO</span></div>
</header>

<main>
  <div class="panel">
    <label class="field-label">Seu nome</label>
    <input type="text" id="nameInput" placeholder="Como você quer aparecer no palco">
  </div>

  <div class="panel">
    <label class="field-label">Buscar música no YouTube</label>
    <p class="helptext" style="margin-top:0; margin-bottom:10px;">Digite o <strong>nome da música e/ou do artista</strong> e inclua obrigatoriamente a palavra <strong>"Karaokê"</strong> na busca, para trazer só versões próprias pra cantar.</p>
    <div class="row">
      <input type="text" id="searchInput" placeholder="Ex: Troca de Calçada Marília Mendonça Karaokê">
      <button class="btn" id="searchBtn" style="width:auto;">Buscar</button>
    </div>
    <ul class="list" id="results"></ul>
    <p class="helptext" id="apiStatus"></p>
  </div>

  <div class="panel">
    <h3 style="margin:0 0 10px; font-family:'Big Shoulders Display',sans-serif; color:var(--brass); text-transform:uppercase; font-size:16px;">Fila agora</h3>
    <ul class="list" id="queueList"></ul>
    <div class="empty-state" id="queueEmpty">A fila está vazia — seja o primeiro a cantar!</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBvRzwcWkw0SikFxIaAFgeVMMV5TemGtZk",
  authDomain: "karaoke-estacao-a0771.firebaseapp.com",
  projectId: "karaoke-estacao-a0771",
  storageBucket: "karaoke-estacao-a0771.firebasestorage.app",
  messagingSenderId: "597665195053",
  appId: "1:597665195053:web:2b0d230436c57a30b184a4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>{ t.style.display='none'; }, 2500);
}

/* nome fica salvo neste celular pra não digitar toda vez */
const NAME_KEY='estacaoParticipantName';
let nameWorks = true;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ nameWorks=false; }
const nameInput = document.getElementById('nameInput');
if(nameWorks){ nameInput.value = localStorage.getItem(NAME_KEY) || ''; }
nameInput.addEventListener('change', ()=>{ if(nameWorks) localStorage.setItem(NAME_KEY, nameInput.value.trim()); });

/* chave da API do YouTube compartilhada, configurada uma vez no palco */
let apiKey = '';
db.collection('config').doc('settings').get().then(doc=>{
  apiKey = (doc.exists && doc.data().youtubeApiKey) || '';
  document.getElementById('apiStatus').textContent = apiKey ? '' : 'A busca ainda não foi liberada pelo bar — peça pro pessoal do palco configurar a chave da API.';
  document.getElementById('searchBtn').disabled = !apiKey;
});

async function search(){
  const q = document.getElementById('searchInput').value.trim();
  const results = document.getElementById('results');
  if(!q) return;
  if(!apiKey){ showToast('Busca ainda não disponível.'); return; }
  results.innerHTML = '<li><span class="song-title">Buscando...</span></li>';
  try{
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&q=${encodeURIComponent(q+' karaoke')}&key=${apiKey}`;
    const r = await fetch(url);
    const j = await r.json();
    if(j.error){ results.innerHTML = `<li><span class="song-title">Erro: ${escapeHtml(j.error.message)}</span></li>`; return; }
    results.innerHTML = '';
    (j.items||[]).forEach(item=>{
      const ytId = item.id.videoId;
      const title = item.snippet.title;
      const thumb = item.snippet.thumbnails?.default?.url || '';
      const li = document.createElement('li');
      li.innerHTML = `<img src="${thumb}" width="64" height="48" style="object-fit:cover;">
        <span class="song-title">${escapeHtml(title)}</span>`;
      const btn = document.createElement('button');
      btn.className='mini'; btn.textContent='Entrar na fila';
      btn.onclick = ()=> addToQueue(ytId, title, thumb);
      li.appendChild(btn);
      results.appendChild(li);
    });
    if(!(j.items||[]).length) results.innerHTML = '<li><span class="song-title">Nada encontrado.</span></li>';
  }catch(e){
    results.innerHTML = '<li><span class="song-title">Falha na busca. Confira sua conexão.</span></li>';
  }
}
document.getElementById('searchBtn').onclick = search;
document.getElementById('searchInput').addEventListener('keydown', e=>{ if(e.key==='Enter') search(); });

function addToQueue(ytId, title, thumb){
  const name = nameInput.value.trim();
  if(!name){ showToast('Digite seu nome primeiro!'); nameInput.focus(); return; }
  if(nameWorks) localStorage.setItem(NAME_KEY, name);
  db.collection('queue').add({
    title, ytId, thumb: thumb||'', type:'youtube', playerName:name, submittedAt: FieldValue.serverTimestamp()
  });
  showToast(`Você entrou na fila com "${title}"`);
}

/* fila em tempo real, pra participante ver a própria posição */
db.collection('queue').orderBy('submittedAt','asc').onSnapshot(snap=>{
  const list = document.getElementById('queueList');
  const empty = document.getElementById('queueEmpty');
  const items = snap.docs.map(d=>d.data());
  list.innerHTML = '';
  empty.style.display = items.length ? 'none' : 'block';
  items.forEach((s,idx)=>{
    const li = document.createElement('li');
    li.innerHTML = `<span class="tag">${idx+1}º</span>
      <span class="song-title">${escapeHtml(s.playerName||'Equipe')} — ${escapeHtml(s.title)}</span>`;
    list.appendChild(li);
  });
});
</script>
</body>
</html>
